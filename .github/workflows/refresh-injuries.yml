name: Refresh NBA injuries
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install injury report reader
        run: python -m pip install nba-injury-report==0.1.0
      - name: Retrieve NBA official injury report
        run: python update_injuries.py
      - name: Commit refreshed CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/injuries.csv
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Update official NBA injuries'
            git push
          fi
